name: CI

on:
  push:
    branches: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the test environment
        run: python -m pip install --upgrade pip .[dev]
      - name: Run tests and static checks
        run: make check
      - name: Check maintained Python files compile
        run: python -m compileall -q *.py tests scripts
