name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-release-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Match the tag to project metadata
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"

  windows:
    needs: verify-release-tag
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build unsigned Windows artifacts
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            build/windows/*.zip
            build/windows/installer/*.msi

  debian:
    needs: verify-release-tag
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - name: Install Debian build dependencies
        run: |
          apt-get update
          apt-get install --yes make
          make SUDO= install-deb
      - name: Build the Debian package
        run: bash scripts/build-deb.sh
      - uses: actions/upload-artifact@v6
        with:
          name: debian
          path: build/deb/*.deb

  rpm:
    needs: verify-release-tag
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install RPM build dependencies
        run: |
          dnf --assumeyes install dnf-plugins-core rpm-build
          dnf --assumeyes builddep packaging/rpm/bwreplacer.spec
      - name: Build the RPM package
        run: |
          bash scripts/build-rpm.sh
          mkdir -p build/release
          cp build/rpm/rpmbuild/RPMS/noarch/*.rpm build/release/
      - uses: actions/upload-artifact@v6
        with:
          name: rpm
          path: build/release/*.rpm

  publish:
    needs: [windows, debian, rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish the unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
          artifact_files=()
          while IFS= read -r -d '' artifact; do
            artifact_files+=("$artifact")
          done < <(find release-artifacts -type f -print0)
          if (( ${#artifact_files[@]} == 0 )); then
            echo "No release files were downloaded." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${artifact_files[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
